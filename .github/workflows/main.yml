name: Web Request Action

on:
  push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: Satak/webrequest-action@v1.5.0
      with:
        url: ${{ secrets.PANEL_URL }}/api/client/servers/${{ secrets.SERVER_ID }}/power
        method: POST
        payload: '{"signal": "restart"}'
        headers: '{"Bearer": "${{ secrets.API_KEY }}"}'
