name: Web Request Action

on:
  push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: cssnr/web-request-action@v2
      with:
        url: ${{ secrets.PANEL_URL }}/api/client/servers/${{ secrets.SERVER_ID }}/power
        method: POST
        data: '{"signal": "restart"}'
        headers: '{"Authorization": "Bearer ${{ secrets.API_KEY }}", "Content-Type": "application/json", "Accept": "Application/vnd.pterodactyl.v1+json"}'
        insecure: true
